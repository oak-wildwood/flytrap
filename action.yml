name: Flytrap
description: Review a pull request when a collaborator with write access comments @flytrap on it.
branding:
  icon: eye
  color: orange

inputs:
  claude_code_oauth_token:
    description: Claude Code OAuth token for the Claude Adapter. Give this or anthropic_api_key.
    required: false
  anthropic_api_key:
    description: Anthropic API key for the Claude Adapter. Give this or claude_code_oauth_token.
    required: false
  model:
    description: Model the Claude Adapter runs.
    required: false
    default: opus
  github_token:
    description: Token Flytrap's own steps use to read the PR and post the Review.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # First, before any checkout or model call (ADR 0004). Flytrap runs from the action's own
    # copy ($GITHUB_ACTION_PATH), never from the pull request's code.
    - name: Check the commenter and gather the diff
      id: prepare
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: node "$GITHUB_ACTION_PATH/bin/flytrap.js" prepare

    - name: Say why there is no Review
      if: steps.prepare.outputs.proceed != 'true'
      shell: bash
      env:
        REASON: ${{ steps.prepare.outputs.reason }}
      run: printf '::notice title=Flytrap skipped::%s\n' "$REASON"

    - name: Check exactly one credential is set
      if: steps.prepare.outputs.proceed == 'true'
      shell: bash
      env:
        HAS_OAUTH: ${{ inputs.claude_code_oauth_token != '' }}
        HAS_KEY: ${{ inputs.anthropic_api_key != '' }}
      run: |
        if [ "$HAS_OAUTH" = "$HAS_KEY" ]; then
          msg='Set exactly one of claude_code_oauth_token and anthropic_api_key.'
          printf '::error::%s\n' "$msg"
          printf '%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi

    # So the model can Read changed files, fork PRs included. Nothing in it is ever executed:
    # no install, no build, no scripts, and no credentials left in the checkout.
    - name: Check out the pull request head
      if: steps.prepare.outputs.proceed == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.prepare.outputs.checkout_ref }}
        persist-credentials: false

    # The Claude Adapter. Read-only tools; Findings come back as structured_output (ADR 0003).
    - name: Review with Claude
      id: review
      if: steps.prepare.outputs.proceed == 'true'
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: |
          --model ${{ inputs.model }}
          --tools Read,Glob,Grep
          --allowedTools Read,Glob,Grep
          --json-schema '${{ steps.prepare.outputs.json_schema }}'

    # Fails the job when structured_output is empty, doesn't match the schema, or the execution
    # transcript shows a permission denial (ADR 0003). Either way, the reason lands in the job
    # summary and nothing gets posted.
    - name: Post the Review
      id: post
      if: steps.prepare.outputs.proceed == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        FLYTRAP_FINDINGS: ${{ steps.review.outputs.structured_output }}
        FLYTRAP_EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
        PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
      run: node "$GITHUB_ACTION_PATH/bin/flytrap.js" post-review --pr "$PR_NUMBER"

    # Swaps the 👀 from #16 for 🚀 once the Review has posted, or 😕 if anything failed after the
    # 👀 went on — so the outcome shows up on the comment, not only in the Actions tab. `always()`
    # so this runs even when an earlier step failed; a no-op when no 👀 went on (a stop before the
    # Review was confirmed). Never fails the job itself: see `flytrap swap-reaction` and src/react.js.
    #
    # The outcome is the post step's own, not `job.status`: inside a composite action, job.status
    # can report the job as it was before this action started, so a failed post could still read
    # as success. steps.post.outcome is `success` only when the Review posted; an earlier failure
    # leaves it `skipped`, which counts as a failure.
    - name: Swap the 👀 reaction for the outcome
      if: always() && steps.prepare.outputs.reaction_id != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        FLYTRAP_COMMENT_ID: ${{ steps.prepare.outputs.comment_id }}
        FLYTRAP_REACTION_ID: ${{ steps.prepare.outputs.reaction_id }}
        FLYTRAP_OUTCOME: ${{ steps.post.outcome }}
      run: node "$GITHUB_ACTION_PATH/bin/flytrap.js" swap-reaction
