name: Flytrap Rubric eval

# Runs the Rubric eval set (test/evals/fixtures) through the real Claude Adapter and reports which
# planted bugs each fixture's Review found or missed, plus the clean fixture's Verdict and Finding
# count. Copy this file to .github/workflows/.
#
# Manual only: it spends usage on every run, so it stays on workflow_dispatch and never runs on a
# pull request. Trigger it from the Actions tab after a Rubric change to see whether Reviews got
# better or worse.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model the Claude Adapter runs.
        required: false
        default: opus

permissions:
  contents: read

jobs:
  list-fixtures:
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.list.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: list
        run: echo "fixtures=$(node bin/flytrap.js eval-list)" >> "$GITHUB_OUTPUT"

  review:
    needs: list-fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson(needs.list-fixtures.outputs.fixtures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the fixture
        id: prepare
        run: node bin/flytrap.js eval-prepare --fixture "${{ matrix.fixture }}"

      # The real Adapter (action.yml), run against a fixture diff instead of a pull request's.
      - name: Review with Claude
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          claude_args: |
            --model ${{ inputs.model }}
            --tools Read,Glob,Grep
            --allowedTools Read,Glob,Grep
            --json-schema '${{ steps.prepare.outputs.json_schema }}'

      - name: Save the fixture's result
        if: always()
        run: |
          mkdir -p eval-results
          printf '%s' '${{ steps.review.outputs.structured_output }}' > "eval-results/${{ matrix.fixture }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-result-${{ matrix.fixture }}
          path: eval-results/
          retention-days: 14

  report:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-result-*
          path: eval-results
          merge-multiple: true
      - name: Build the eval report
        run: node bin/flytrap.js eval-report --dir eval-results
