name: Flytrap

# Comment @flytrap on a pull request to get a Review. Copy this file to .github/workflows/.
#
# `@v1` follows the latest 1.x release; pin `@v1.1.0` (or a SHA) for one exact version.
#
# Use the published action (oak-wildwood/flytrap@...), even in the flytrap repo itself. `uses: ./`
# would run the action from the workspace, and on a PR that is the PR's own code with the repo's
# secrets in reach.
#
# claude-code-action skips runs whose workflow doesn't match the default branch's copy, so a change
# to this file only takes effect once it is merged.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read # the Spec: the issues a pull request closes
  pull-requests: write

jobs:
  review:
    # A cheap pre-filter; the real trigger and permission checks are in `flytrap prepare`.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@flytrap')
    runs-on: ubuntu-latest
    steps:
      - uses: oak-wildwood/flytrap@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
